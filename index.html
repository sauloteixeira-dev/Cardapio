<style>
/*
VOICE: apetitoso, direto, de balcão de lanchonete — nada de corporativo.
IDEA: o cardápio impresso da loja virando app; a sacola é a comanda.
PICTURE: capa colorida da loja + fotos grandes dos produtos.
COLOUR and TYPE: cor da própria loja (accent) sobre branco quente; Figtree.
LAYOUT: coluna única de até 760px no cardápio; painel em abas.
*/
:root{--ac:#d92d20;--on-ac:#fff;--ink:#1c1813;--mut:#6d665e;--line:#e9e4dd;--bg:#fff;--card:#fff;--mus:#f2b705;--disp:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;--ok:#12805c;--r:16px;color-scheme:light}

img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:0;background:var(--ac);color:#fff;font-weight:700}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:color-mix(in srgb,var(--ac) 12%,#fff);color:var(--ac)}
.btn.danger{background:#fff;color:#b42318;border:1.5px solid #f3c7c2}

.btn.wide{width:100%}
:focus-visible{outline:3px solid color-mix(in srgb,var(--ac) 45%,transparent);outline-offset:2px}
label.f{display:block;margin-bottom:14px;font-weight:600;font-size:14px}
label.f span.h{display:block;font-weight:400;color:var(--mut);font-size:13px}
.in{display:block;width:100%;margin-top:6px;min-height:46px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:16px}
textarea.in{min-height:80px;resize:vertical}
.in:focus{border-color:var(--ac);outline:0}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1 1 140px}
.muted{color:var(--mut)}.small{font-size:14px}

/* ===== Cardápio =====

   PICTURE: letreiro da loja na cor dela; fotos à direita das linhas.

   LAYOUT: coluna única até 720px, tudo alinhado à esquerda.
*/

.sign::before{content:"";position:absolute;inset:0;background:var(--cv,none) center/cover;mix-blend-mode:multiply;opacity:.55}

.sign .wrap{position:relative;padding-top:clamp(28px,7vw,56px);padding-bottom:28px;max-width:720px}
.logo{width:64px;height:64px;border-radius:50%;background:#fff center/cover;color:var(--ac);display:grid;place-items:center;font:900 30px/1 var(--disp);box-shadow:0 0 0 3px color-mix(in srgb,var(--on-ac) 35%,transparent);margin-bottom:14px}

/* Sheet / modal: cabeçalho e rodapé fixos, só o meio rola */
.ov{position:fixed;inset:0;background:rgba(20,14,8,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:94dvh;display:flex;flex-direction:column;overflow:hidden;border-radius:22px 22px 0 0;animation:up .22s ease}

@media(min-width:900px){

}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes side{from{transform:translateX(40px);opacity:0}}

.tot{display:flex;justify-content:space-between;font-size:15px;padding:4px 0}

.sec{font:800 22px/1.1 var(--disp);margin:26px 0 10px}
.sec small{font:500 14px 'Instrument Sans',sans-serif;color:var(--mut);margin-left:6px}
.addmore{display:inline-flex;align-items:center;min-height:44px;margin-top:6px;padding:0;border:0;background:none;color:var(--ac);font-weight:700}

/* ===== Painel ===== */
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.top .wrap{max-width:1040px;display:flex;align-items:center;gap:12px;min-height:64px;flex-wrap:wrap;padding-block:8px}
.brand{font-weight:800;font-size:19px;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--ac);display:inline-block}
.pw{max-width:1040px;margin:0 auto;padding:20px 16px 80px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:20px}
.share{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.prow img,.prow .noimg{width:60px;height:60px;border-radius:12px;object-fit:cover;background:#f1ece6;flex:none}
.prow .t{flex:1 1 180px}.prow .t b{display:block}
.prow .acts{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:#f3efea;color:var(--mut);margin-left:6px}
.tag.r{background:#fdecea;color:#b42318}
.pick{display:flex;gap:14px;align-items:center;margin:6px 0 14px}
.pick .pv{width:96px;height:96px;border-radius:14px;background:#f1ece6 center/cover;flex:none;display:grid;place-items:center;color:var(--mut);font-size:13px;text-align:center}

.hero{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:center;max-width:1100px;margin:0 auto;padding:40px 20px}
.hero h1{font-size:clamp(34px,5vw,52px);line-height:1.05;margin:0 0 16px;text-wrap:balance}
.hero p{font-size:18px;color:var(--mut);max-width:34em}
.hero ul{padding:0;list-style:none;margin:20px 0 0}
.hero li{padding:6px 0 6px 30px;position:relative;font-weight:600}
.hero li::before{content:"";position:absolute;left:0;top:11px;width:18px;height:18px;border-radius:6px;background:var(--ac)}
@media(max-width:820px){.hero{grid-template-columns:1fr;min-height:0;gap:24px}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:99;font-weight:600;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.load{padding:80px 20px;text-align:center;color:var(--mut)}
</style>

<script>
{

const toCents = s => { const n = parseFloat(String(s).replace(/[^\d,.-]/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.')); return isNaN(n) ? NaN : Math.round(n*100); };

const store = { get(k,d){try{return JSON.parse(localStorage.getItem(k)) ?? d}catch{return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}} };

function setAccent(c){
  if(!/^#[0-9a-f]{6}$/i.test(c||'')) return;
  const r=document.documentElement.style; r.setProperty('--ac', c);
  const [R,G,B]=[1,3,5].map(i=>{const v=parseInt(c.slice(i,i+2),16)/255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});
  r.setProperty('--on-ac', (0.2126*R+0.7152*G+0.0722*B) > 0.45 ? '#1c1813' : '#fff');

async function compressImage(file, max=1080){
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  let blob = await new Promise(r => c.toBlob(r, 'image/webp', .82));
  if (!blob || blob.type !== 'image/webp') blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .85));
  return blob;
}
async function uploadImage(storeId, file){
  const blob = await compressImage(file);
  const ext = blob.type === 'image/webp' ? 'webp' : 'jpg';
  const path = `${storeId}/${crypto.randomUUID()}.${ext}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: blob.type, cacheControl: '31536000' });
  if (error) throw error;
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}
const waNumber = w => { const d = digits(w); return d.length <= 11 ? '55' + d : d; };

const SLUG = new URLSearchParams(location.search).get('loja');
if (SLUG) Menu(SLUG); else Admin();

  const [{ data: cats }, { data: prods }] = await Promise.all([
    sb.from('categories').select('id,name,position').eq('store_id', st.id).eq('active', true).order('position').order('created_at'),
    sb.from('products').select('id,category_id,name,description,price_cents,image_url,sold_out,position').eq('store_id', st.id).eq('active', true).order('position').order('created_at')
  ]);
  const P = new Map((prods||[]).map(p => [p.id, p]));
  const KEY = 'cart:' + slug;
  let cart = store.get(KEY, []).filter(l => P.has(l.id) && !P.get(l.id).sold_out);
  let q = '';
  const save = () => { store.set(KEY, cart); renderBar(); };
  const count = () => cart.reduce((a,l)=>a+l.qty,0);
  const subtotal = () => cart.reduce((a,l)=>a+l.qty*P.get(l.id).price_cents,0);
  const open = !st.is_paused;
  const fee = st.delivery_fee_cents || 0;
  const feeFor = mode => mode === 'entrega' ? fee : 0;
  const eta = (a,b) => a!=null && b!=null ? `${a}–${b} min` : a!=null ? `${a} min` : '';

  app.innerHTML = `
    <header class="sign" ${st.cover_url ? `style="--cv:url('${esc(st.cover_url)}')"` : ''}><div class="wrap">
      ${st.logo_url ? `<div class="logo" style="background-image:url('${esc(st.logo_url)}')"></div>` : `<div class="logo">${esc(st.name.trim()[0]||'').toUpperCase()}</div>`}
      <h1>${esc(st.name)}</h1>
      <ul class="facts">
        <li class="st ${open?'':'off'}">${open?'Aberto agora':'Fechado no momento'}</li>
        ${st.accepts_delivery && eta(st.delivery_minutes_min,st.delivery_minutes_max) ? `<li>Entrega em ${eta(st.delivery_minutes_min,st.delivery_minutes_max)}</li>` : ''}
        ${st.accepts_delivery ? `<li>${fee ? 'Taxa de entrega ' + brl(fee) : 'Entrega grátis'}</li>` : ''}
        ${st.min_order_cents ? `<li>Pedido mínimo ${brl(st.min_order_cents)}</li>` : ''}
      </ul>
    </div></header>
    <div class="wrap" style="max-width:720px"><div class="search"><input class="in" id="q" type="search" placeholder="Buscar um lanche, bebida…" aria-label="Buscar no cardápio"></div></div>
    <nav class="cats" id="cats"></nav>
    <main class="wrap" id="list"></main>
    <div class="foot">Pedidos enviados pelo WhatsApp da loja · pagamento na entrega ou retirada</div>
    <div class="bar hide" id="bar"><button class="btn" id="openCart"><span><span class="cnt" id="barN"></span>Ver pedido</span><span class="tt" id="barT"></span></button></div>`;

  function renderList(){
    const t = q.trim().toLowerCase();
    const groups = (cats||[]).map(c => ({ c, items: (prods||[]).filter(p => p.category_id===c.id && (!t || (p.name+' '+(p.description||'')).toLowerCase().includes(t))) })).filter(g => g.items.length);
    $('#cats').innerHTML = groups.map((g,i) => `<button class="chip ${i===0?'on':''}" data-go="${esc(g.c.id)}">${esc(g.c.name)}</button>`).join('');
    $('#list').innerHTML = groups.length ? groups.map(g => `
      <section class="cat" id="c-${esc(g.c.id)}"><h2>${esc(g.c.name)} <small>${g.items.length} ${g.items.length>1?'opções':'opção'}</small></h2>
      ${g.items.map(p => `<button class="item ${p.sold_out?'out':''}" data-p="${esc(p.id)}" ${p.sold_out?'aria-disabled="true"':''}>
        <div class="t"><div class="nm"><h3>${esc(p.name)}</h3><span class="lead" aria-hidden="true"></span><span class="pz">${priceHTML(p.price_cents)}</span></div>
        ${p.description?`<p>${esc(p.description)}</p>`:''}
        ${p.sold_out?'<span class="soldtag">Esgotado hoje</span>':''}</div>
        ${p.image_url?`<img class="ph" src="${esc(p.image_url)}" alt="" loading="lazy">`:''}
      </button>`).join('')}</section>`).join('')
      : `<div class="empty">${t ? 'Nada encontrado pra essa busca.' : 'O cardápio ainda está sendo montado.'}</div>`;
  }
  function renderBar(){
    const n = count();
    $('#bar').classList.toggle('hide', !n);
    $('#barN').textContent = n;
    $('#barT').textContent = brl(subtotal());
  }
  renderList(); renderBar();

  // Aba ativa acompanha a rolagem; títulos nunca ficam escondidos atrás das abas
  let lockSpy = 0;
  const tabsH = () => { const h = $('#cats').offsetHeight; document.documentElement.style.setProperty('--tabs', h + 'px'); return h; };
  function setTab(id){
    document.querySelectorAll('.chip').forEach(c => {
      const on = c.dataset.go === id; c.classList.toggle('on', on);
      if (on) { const nav = $('#cats'); nav.scrollTo({ left: c.offsetLeft - 16, behavior: 'smooth' }); }
    });
  }
  function spy(){
    if (Date.now() < lockSpy) return;
    const line = tabsH() + 24; let cur = null;
    document.querySelectorAll('.cat').forEach(sec => { if (sec.getBoundingClientRect().top - line <= 0) cur = sec.id.slice(2); });
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) cur = [...document.querySelectorAll('.cat')].pop()?.id.slice(2) || cur;
    cur = cur || document.querySelector('.cat')?.id.slice(2);
    const active = document.querySelector('.chip.on')?.dataset.go;
    if (cur && cur !== active) setTab(cur);
  }
  addEventListener('scroll', () => requestAnimationFrame(spy), { passive: true });
  addEventListener('resize', tabsH); tabsH();

  $('#q').addEventListener('input', e => { q = e.target.value; renderList(); });
  $('#cats').addEventListener('click', e => {
    const b = e.target.closest('[data-go]'); if(!b) return;
    document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c===b));
    const sec = document.getElementById('c-'+b.dataset.go); if (!sec) return;
    lockSpy = Date.now() + 900; setTab(b.dataset.go);
    window.scrollTo({ top: sec.getBoundingClientRect().top + scrollY - tabsH(), behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  });
  $('#list').addEventListener('click', e => {
    const b = e.target.closest('[data-p]'); if(!b) return;
    const p = P.get(b.dataset.p); if (p.sold_out) return toast('Esse item está esgotado');
    productSheet(p);
  });
  $('#openCart').addEventListener('click', cartSheet);

  function productSheet(p){
    let qty = 1;
    openModal(`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(p.name)}">
      <div class="hd"><h3>${esc(p.name)}</h3><button class="x" aria-label="Fechar">×</button></div>
      <div class="sc">${p.image_url?`<img class="big" src="${esc(p.image_url)}" alt="">`:''}
      <div class="bd" style="padding-top:16px">
        ${p.description?`<p class="muted" style="margin-top:0">${esc(p.description)}</p>`:''}
        <p class="price" style="font-size:20px">${brl(p.price_cents)}</p>
        <label class="f">Alguma observação? <span class="h">Ex.: sem cebola, ponto da carne…</span>
          <textarea class="in" id="obs" maxlength="140"></textarea></label>
      </div></div>
      <div class="ft"><div class="qty"><button id="m" aria-label="Diminuir">−</button><span id="qv">1</span><button id="pl" aria-label="Aumentar">+</button></div>
        <button class="btn" style="flex:1" id="add">Adicionar <span class="price" id="at">${brl(p.price_cents)}</span></button></div>
    </div>`);
    const upd = () => { $('#qv').textContent = qty; $('#at').textContent = brl(qty*p.price_cents); };
    $('#m').onclick = () => { if(qty>1){qty--;upd()} };
    $('#pl').onclick = () => { qty++; upd(); };
    $('#add').onclick = () => {
      const obs = $('#obs').value.trim();
      const ex = cart.find(l => l.id===p.id && (l.obs||'')===obs);
      if (ex) ex.qty += qty; else cart.push({ id:p.id, qty, obs });
      save(); closeModal(); toast(`${qty}× ${p.name} na sacola`);
    };
  }

  function cartSheet(){
    const cust = store.get('cliente', {});
    const modes = [st.accepts_delivery && ['entrega','Entrega'], st.accepts_pickup && ['retirada','Retirada'], st.accepts_dine_in && ['mesa','Na mesa']].filter(Boolean);
    if (!modes.length) modes.push(['entrega','Entrega']);
    const mode0 = modes.find(m=>m[0]===cust.mode) ? cust.mode : modes[0][0];
    openModal(`<div class="sheet" role="dialog" aria-modal="true" aria-label="Seu pedido">
      <div class="hd"><h3>Seu pedido</h3><button class="x" aria-label="Fechar">×</button></div>
      <form class="sc bd" id="ck" novalidate>
        <div id="lines"></div>
        <button type="button" class="addmore" data-close>+ Adicionar mais itens</button>
        <div class="sec">Seus dados</div>
        <div class="row"><label class="f">Nome<input class="in" name="nome" required value="${esc(cust.nome||'')}" autocomplete="name"></label>
        <label class="f">Telefone <span class="muted" style="font-weight:400">(opcional)</span><input class="in" name="tel" inputmode="tel" value="${esc(cust.tel||'')}" autocomplete="tel"></label></div>
        <div class="sec">Como você quer receber?</div>
        <div class="seg">${modes.map(m=>`<label><input type="radio" name="mode" value="${m[0]}" ${m[0]===mode0?'checked':''}>${m[1]}</label>`).join('')}</div>
        <div id="addr">
          <div class="row"><label class="f" style="flex:3 1 200px">Rua<input class="in" name="rua" value="${esc(cust.rua||'')}" autocomplete="address-line1"></label>
          <label class="f" style="flex:1 1 90px">Número<input class="in" name="num" value="${esc(cust.num||'')}"></label></div>
          <div class="row"><label class="f">Bairro<input class="in" name="bairro" value="${esc(cust.bairro||'')}"></label>
          <label class="f">Complemento <span class="muted" style="font-weight:400">(opcional)</span><input class="in" name="comp" value="${esc(cust.comp||'')}" placeholder="Apto, ponto de referência"></label></div>
        </div>
        <label class="f hide" id="mesaF">Número da mesa<input class="in" name="mesa" inputmode="numeric"></label>
        <div class="sec">Pagamento <small>na entrega ou retirada</small></div>
        <div class="seg">${['Pix','Dinheiro','Cartão'].map(m=>`<label><input type="radio" name="pag" value="${m}" ${(cust.pag||'Pix')===m?'checked':''}>${m}</label>`).join('')}</div>
        <label class="f hide" id="trocoF">Troco para quanto? <span class="muted" style="font-weight:400">(deixe vazio se não precisar)</span><input class="in" name="troco" inputmode="decimal" placeholder="Ex.: 100"></label>
        <label class="f" style="margin-top:6px">Observação do pedido <span class="muted" style="font-weight:400">(opcional)</span><textarea class="in" name="obs" maxlength="200"></textarea></label>
        <div id="tots"></div>
      </form>
      <div class="ft"><p class="warn hide" id="warn"></p><div class="sum"><span>Total</span><b id="ftT"></b></div>
        <button class="btn" id="send" ${open?'':'disabled'}>${open?'Enviar pelo WhatsApp':'Loja fechada agora'}</button></div>
    </div>`, 'side');
    const f = $('#ck');
    const sync = () => {
      const m = f.mode.value, pag = f.pag.value;
      $('#addr').classList.toggle('hide', m!=='entrega');
      $('#mesaF').classList.toggle('hide', m!=='mesa');
      $('#trocoF').classList.toggle('hide', pag!=='Dinheiro');
    };
    const draw = () => {
      if (!cart.length) { closeModal(); return; }
      $('#lines').innerHTML = cart.map((l,i) => { const p=P.get(l.id); return `<div class="line">
        <div><b>${esc(p.name)}</b>${l.obs?`<div class="obs">Obs: ${esc(l.obs)}</div>`:''}</div>
        <div class="lp">${brl(p.price_cents*l.qty)}</div>
        <div class="qty"><button type="button" data-d="${i}" aria-label="${l.qty>1?'Diminuir':'Remover'}">${l.qty>1?'−':TRASH}</button><span>${l.qty}</span><button type="button" data-i="${i}" aria-label="Aumentar">+</button></div></div>`; }).join('');
      const sub = subtotal(), min = st.min_order_cents||0;
      $('#tots').innerHTML = `<div style="margin-top:22px;padding-top:12px;border-top:1px solid var(--line)"></div><div class="tot"><span>Subtotal</span><span class="price">${brl(sub)}</span></div>
        ${f.mode.value==='entrega'?`<div class="tot"><span>Taxa de entrega</span><span class="price">${fee ? brl(fee) : 'Grátis'}</span></div>`:''}
`;
      $('#ftT').textContent = brl(sub + feeFor(f.mode.value));
      $('#warn').textContent = sub<min ? `Pedido mínimo de ${brl(min)}. Faltam ${brl(min-sub)}.` : '';
      $('#warn').classList.toggle('hide', sub>=min);
      $('#send').disabled = !open || sub < min;
    };
    $('#lines').addEventListener('click', e => {
      const d = e.target.closest('[data-d]'), i = e.target.closest('[data-i]');
      if (d) { const l = cart[+d.dataset.d]; l.qty--; if(!l.qty) cart.splice(+d.dataset.d,1); }
      else if (i) cart[+i.dataset.i].qty++; else return;
      save(); draw();
    });
    f.addEventListener('change', () => { sync(); draw(); });
    sync(); draw();
    $('#send').onclick = () => {
      const v = Object.fromEntries(new FormData(f));
      if (!v.nome.trim()) return f.nome.focus(), toast('Coloque seu nome');
      if (v.mode==='entrega' && (!v.rua.trim() || !v.num.trim() || !v.bairro.trim())) return toast('Preencha rua, número e bairro');
      store.set('cliente', { nome:v.nome, tel:v.tel, mode:v.mode, rua:v.rua, num:v.num, bairro:v.bairro, comp:v.comp, pag:v.pag });
      const L = [];
      L.push(`*Novo pedido — ${st.name}*`, '');
      cart.forEach(l => { const p=P.get(l.id); L.push(`${l.qty}x ${p.name} — ${brl(p.price_cents*l.qty)}`); if(l.obs) L.push(`   _Obs: ${l.obs}_`); });
      L.push('', `*Subtotal:* ${brl(subtotal())}`);
      if (v.mode==='entrega') L.push(`*Taxa de entrega:* ${fee ? brl(fee) : 'Grátis'}`);
      L.push(`*Total:* ${brl(subtotal() + feeFor(v.mode))}`);
      L.push('', `*Cliente:* ${v.nome.trim()}`); if (v.tel.trim()) L.push(`*Telefone:* ${v.tel.trim()}`);
      if (v.mode==='entrega') L.push(`*Entrega:* ${v.rua.trim()}, ${v.num.trim()} — ${v.bairro.trim()}${v.comp.trim()?` (${v.comp.trim()})`:''}`);
      else if (v.mode==='mesa') L.push(`*Comer no local*${v.mesa?` — Mesa ${v.mesa}`:''}`);
      else L.push('*Retirada no local*');
      const tc = toCents(v.troco);
      L.push(`*Pagamento:* ${v.pag}${v.pag==='Dinheiro' && tc>0 ? ` (troco para ${brl(tc)})` : ''}`);
      if (v.obs.trim()) L.push(`*Obs.:* ${v.obs.trim()}`);
      if (!st.whatsapp) return toast('A loja ainda não cadastrou o WhatsApp');
      const url = `https://wa.me/${waNumber(st.whatsapp)}?text=${encodeURIComponent(L.join('\n'))}`;
      cart = []; save(); closeModal();
      location.href = url;
    };
  }
}

async function Admin(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return Landing();
  const { data: mem } = await sb.from('store_members').select('store_id, stores(name)').eq('user_id', session.user.id);
  if (!mem?.length) return CreateStore(session);
  const mine = mem.map(m => ({ id: m.store_id, name: m.stores?.name || 'Loja' })).sort((a,b) => a.name.localeCompare(b.name));
  const pref = store.get('loja-atual', null);
  Panel(mine.some(m => m.id === pref) ? pref : mine[0].id, mine);
}
sb.auth.onAuthStateChange((ev) => { if (!SLUG && (ev==='SIGNED_IN'||ev==='SIGNED_OUT')) Admin(); });

function Landing(){
  let mode = 'login';
  app.innerHTML = `<div class="hero">
    <div>
      <h1>Seu cardápio digital, com pedidos direto no WhatsApp</h1>
      <p>Cadastre produtos com foto, descrição e preço. Seu cliente monta o pedido pelo celular e ele chega pronto no WhatsApp da loja.</p>
      <ul><li>Sem taxa por pedido</li><li>Pronto em 10 minutos</li><li>Funciona em qualquer celular, sem baixar app</li></ul>
    </div>
    <div class="card" style="padding:24px">
      <div class="tabs" id="at"><button class="on" data-m="login">Entrar</button><button data-m="signup">Criar conta</button></div>
      <form id="af">
        <label class="f">Email<input class="in" name="email" type="email" required autocomplete="email"></label>
        <label class="f">Senha<input class="in" name="pass" type="password" required minlength="6" autocomplete="current-password"></label>
        <button class="btn wide" id="ab">Entrar</button>
        <p class="small muted" id="amsg" style="margin-bottom:0"></p>
      </form>
    </div></div>`;
  $('#at').onclick = e => { const b=e.target.closest('[data-m]'); if(!b) return; mode=b.dataset.m;
    document.querySelectorAll('#at button').forEach(x=>x.classList.toggle('on',x===b)); $('#ab').textContent = mode==='login'?'Entrar':'Criar conta grátis'; $('#amsg').textContent=''; };
  $('#af').onsubmit = async e => {
    e.preventDefault(); const f=e.target, email=f.email.value.trim(), password=f.pass.value;
    $('#ab').disabled = true; $('#amsg').textContent='';
    try {
      if (mode==='login') { const {error} = await sb.auth.signInWithPassword({email,password}); if(error) throw error; }
      else { const {data,error} = await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}}); if(error) throw error;
        if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0)
          $('#amsg').textContent = 'Esse email já tem conta. Clique em "Entrar" e use sua senha.';
        else if (!data.session) $('#amsg').textContent = 'Conta criada! Enviamos um link pro seu email (olhe também o spam). Confirme e depois clique em Entrar.'; }
    } catch(err) { $('#amsg').textContent = errMsg(err); }
    $('#ab').disabled = false;
  };
}

function CreateStore(session){
  app.innerHTML = `<div class="pw" style="max-width:560px">
    <div class="card" style="padding:24px"><h2>Vamos criar sua loja</h2>
    <form id="cs">
      <label class="f">Nome da loja<input class="in" name="name" required maxlength="60" placeholder="Ex.: Lanchonete do Zé"></label>
      <label class="f">Link do cardápio <span class="h">Só letras minúsculas, números e hífen</span><input class="in" name="slug" required pattern="[a-z0-9][a-z0-9-]{1,38}[a-z0-9]"></label>
      <p class="small muted" id="prev" style="margin-top:-6px"></p>
      <label class="f">WhatsApp que recebe os pedidos <span class="h">DDD + número</span><input class="in" name="wa" inputmode="tel" required placeholder="35 99999-8888"></label>
      <button class="btn wide">Criar loja</button><p class="small" id="cmsg" style="color:#b42318"></p>
    </form>
    <button class="btn ghost sm" id="out">Sair</button></div></div>`;
  const f = $('#cs'); let touched = false;
  const pv = () => $('#prev').textContent = f.slug.value ? menuLink(f.slug.value) : '';
  f.name.oninput = () => { if(!touched) f.slug.value = slugify(f.name.value); pv(); };
  f.slug.oninput = () => { touched = true; f.slug.value = slugify(f.slug.value); pv(); };
  $('#out').onclick = () => sb.auth.signOut();
  f.onsubmit = async e => {
    e.preventDefault(); const wa = digits(f.wa.value);
    if (wa.length < 10 || wa.length > 13) return $('#cmsg').textContent = 'WhatsApp inválido. Use DDD + número.';
    if (!/^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$/.test(f.slug.value)) return $('#cmsg').textContent = 'Link inválido: mínimo 3 caracteres, sem espaço nem acento.';
    const { data, error } = await sb.rpc('create_my_store', { p_name: f.name.value, p_slug: f.slug.value, p_whatsapp: wa });
    if (error) return $('#cmsg').textContent = errMsg(error);
    Panel(data);
  };
}

async function Panel(storeId, mine = []){
  store.set('loja-atual', storeId);
  let st, cats=[], prods=[], tab = store.get('tab','produtos');
  async function load(){
    const [a,b,c] = await Promise.all([
      sb.from('stores').select('*').eq('id',storeId).single(),
      sb.from('categories').select('*').eq('store_id',storeId).order('position').order('created_at'),
      sb.from('products').select('*').eq('store_id',storeId).order('position').order('created_at')
    ]);
    st=a.data; cats=b.data||[]; prods=c.data||[]; setAccent(st.accent_color);
  }
  await load();
  function frame(){
    app.innerHTML = `<header class="top"><div class="wrap">
      <div class="brand"><i></i>${mine.length > 1
        ? `<select class="in" id="sw" aria-label="Trocar de loja" style="margin:0;min-height:40px;font-weight:800;width:auto">${mine.map(m => `<option value="${esc(m.id)}" ${m.id===storeId?'selected':''}>${esc(m.name)}</option>`).join('')}</select>`
        : esc(st.name)}</div>
      <a class="btn soft sm" href="${esc(menuLink(st.slug))}" target="_blank" rel="noopener">Ver cardápio</a>
      <button class="btn ghost sm" id="out">Sair</button></div></header>
      <div class="pw">
        <div class="card"><h2>Link do seu cardápio</h2>
          <div class="share"><code id="lk">${esc(menuLink(st.slug))}</code><button class="btn sm" id="cp">Copiar link</button>
          <a class="btn ghost sm" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('Faça seu pedido pelo nosso cardápio: '+menuLink(st.slug))}">Divulgar no WhatsApp</a></div>
          ${st.is_paused?'<p class="small" style="color:#b42318;margin-bottom:0">A loja está pausada: clientes veem "Fechado" e não conseguem enviar pedido.</p>':''}
        </div>
        <nav class="tabs" id="tb">${[['produtos','Produtos'],['categorias','Categorias'],['loja','Minha loja']].map(t=>`<button data-t="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('')}</nav>
        <div id="body"></div></div>`;
    $('#out').onclick = () => sb.auth.signOut();
    $('#sw') && ($('#sw').onchange = e => Panel(e.target.value, mine));
    $('#cp').onclick = async () => { try { await navigator.clipboard.writeText(menuLink(st.slug)); toast('Link copiado!'); } catch { toast('Selecione o link e copie'); } };
    $('#tb').onclick = e => { const b=e.target.closest('[data-t]'); if(!b) return; tab=b.dataset.t; store.set('tab',tab); frame(); };
    ({produtos:Products, categorias:Categories, loja:Settings})[tab]();
  }
  const refresh = async () => { await load(); frame(); };

  // ---------- Produtos ----------
  function Products(){
    const body = $('#body');
    if (!cats.length) { body.innerHTML = `<div class="card empty"><p>Crie uma categoria primeiro (ex.: Lanches, Bebidas, Porções).</p><button class="btn" id="gc">Criar categoria</button></div>`; $('#gc').onclick=()=>{tab='categorias';frame()}; return; }
    body.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap"><span class="muted">${prods.length} produto(s)</span><button class="btn" id="np">+ Novo produto</button></div>` +
      cats.map(c => { const ps = prods.filter(p=>p.category_id===c.id); return `<div class="card"><h2>${esc(c.name)}${c.active?'':'<span class="tag">oculta</span>'}</h2>
        ${ps.length ? ps.map(p => `<div class="prow">
          ${p.image_url?`<img src="${esc(p.image_url)}" alt="">`:'<div class="noimg"></div>'}
          <div class="t"><b>${esc(p.name)}${p.sold_out?'<span class="tag r">esgotado</span>':''}${p.active?'':'<span class="tag">oculto</span>'}</b><span class="price small">${brl(p.price_cents)}</span></div>
          <div class="acts">
            <button class="btn ghost sm" data-so="${esc(p.id)}">${p.sold_out?'Tem de novo':'Esgotou'}</button>
            <button class="btn soft sm" data-ed="${esc(p.id)}">Editar</button></div></div>`).join('') : '<p class="muted small">Nenhum produto nessa categoria.</p>'}
      </div>`; }).join('');
    $('#np').onclick = () => productForm();
    body.onclick = async e => {
      const so = e.target.closest('[data-so]'), ed = e.target.closest('[data-ed]');
      if (so) { const p = prods.find(x=>x.id===so.dataset.so); const {error} = await sb.from('products').update({sold_out:!p.sold_out}).eq('id',p.id); if(error) return toast(errMsg(error)); toast(p.sold_out?'Produto disponível':'Marcado como esgotado'); refresh(); }
      if (ed) productForm(prods.find(x=>x.id===ed.dataset.ed));
    };
  }
  function productForm(p){
    const isNew = !p; p = p || { name:'', description:'', price_cents:0, category_id:cats[0].id, image_url:null, active:true };
    let img = p.image_url, file = null;
    openModal(`<div class="sheet" role="dialog" aria-modal="true"><div class="hd"><h3>${isNew?'Novo produto':'Editar produto'}</h3><button class="x" aria-label="Fechar">×</button></div>
      <form class="sc bd" id="pf" style="padding-top:16px">
        <div class="pick"><div class="pv" id="pv" style="${img?`background-image:url('${esc(img)}')`:''}">${img?'':'Sem foto'}</div>
          <div><label class="btn soft sm" style="cursor:pointer">Escolher foto<input type="file" accept="image/*" id="fi" class="hide"></label>
          ${img?'<button type="button" class="btn ghost sm" id="rm" style="margin-left:6px">Tirar foto</button>':''}<p class="small muted" style="margin:6px 0 0">A foto é reduzida automaticamente.</p></div></div>
        <label class="f">Nome<input class="in" name="name" required maxlength="80" value="${esc(p.name)}"></label>
        <label class="f">Descrição <span class="h">O que vem no produto</span><textarea class="in" name="desc" maxlength="400">${esc(p.description||'')}</textarea></label>
        <div class="row"><label class="f">Preço (R$)<input class="in" name="price" inputmode="decimal" required value="${isNew?'':centsIn(p.price_cents)}" placeholder="0,00"></label>
        <label class="f">Categoria<select class="in" name="cat">${cats.map(c=>`<option value="${esc(c.id)}" ${c.id===p.category_id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label></div>
        <label class="chk"><input type="checkbox" name="active" ${p.active?'checked':''}> Mostrar no cardápio</label>
        <p class="small" id="pmsg" style="color:#b42318"></p>
      </form>
      <div class="ft">${isNew?'':'<button class="btn danger" id="del">Apagar</button>'}<button class="btn" style="flex:1" id="sv">Salvar</button></div></div>`);
    $('#fi').onchange = e => { file = e.target.files[0]; if(!file) return; const u = URL.createObjectURL(file); $('#pv').style.backgroundImage=`url('${u}')`; $('#pv').textContent=''; };
    $('#rm') && ($('#rm').onclick = () => { img=null; file=null; $('#pv').style.backgroundImage=''; $('#pv').textContent='Sem foto'; });
    $('#sv').onclick = async () => {
      const f = $('#pf'), price = toCents(f.price.value);
      if (!f.name.value.trim()) return $('#pmsg').textContent='Coloque o nome do produto.';
      if (isNaN(price) || price<0) return $('#pmsg').textContent='Preço inválido. Ex.: 24,90';
      $('#sv').disabled = true; $('#sv').textContent = file ? 'Enviando foto…' : 'Salvando…';
      try {
        if (file) img = await uploadImage(storeId, file);
        const row = { name:f.name.value.trim(), description:f.desc.value.trim()||null, price_cents:price, category_id:f.cat.value, image_url:img, active:f.active.checked };
        const { error } = isNew ? await sb.from('products').insert({ ...row, store_id:storeId, position:prods.length }) : await sb.from('products').update(row).eq('id',p.id);
        if (error) throw error;
        closeModal(); toast('Produto salvo'); refresh();
      } catch(err) { $('#pmsg').textContent = errMsg(err); $('#sv').disabled=false; $('#sv').textContent='Salvar'; }
    };
    $('#del') && ($('#del').onclick = async () => {
      if (!confirm('Apagar "'+p.name+'"? Isso não pode ser desfeito.')) return;
      const { error } = await sb.from('products').delete().eq('id',p.id);
      if (error) { // já tem pedidos ligados: só esconde
        await sb.from('products').update({active:false}).eq('id',p.id); toast('Produto tem pedidos antigos, então foi ocultado.');
      } else toast('Produto apagado');
      closeModal(); refresh();
    });
  }

  // ---------- Categorias ----------
  function Categories(){
    $('#body').innerHTML = `<div class="card"><h2>Nova categoria</h2>
      <form id="nc" class="share"><input class="in" name="n" placeholder="Ex.: Lanches" required maxlength="40" style="flex:1 1 220px;margin:0"><button class="btn">Adicionar</button></form></div>
      <div class="card"><h2>Suas categorias</h2>${cats.length?cats.map((c,i)=>`<div class="prow">
        <div class="t"><b>${esc(c.name)}${c.active?'':'<span class="tag">oculta</span>'}</b><span class="small muted">${prods.filter(p=>p.category_id===c.id).length} produto(s)</span></div>
        <div class="acts">
          <button class="btn ghost sm" data-up="${i}" ${i?'':'disabled'} aria-label="Subir">↑</button>
          <button class="btn ghost sm" data-dn="${i}" ${i<cats.length-1?'':'disabled'} aria-label="Descer">↓</button>
          <button class="btn ghost sm" data-hd="${i}">${c.active?'Ocultar':'Mostrar'}</button>
          <button class="btn soft sm" data-rn="${i}">Renomear</button>
          <button class="btn danger sm" data-rm="${i}">Apagar</button></div></div>`).join(''):'<p class="muted">Nenhuma categoria ainda.</p>'}</div>`;
    $('#nc').onsubmit = async e => { e.preventDefault(); const n=e.target.n.value.trim(); if(!n) return;
      const {error} = await sb.from('categories').insert({store_id:storeId,name:n,position:cats.length}); if(error) return toast(errMsg(error)); toast('Categoria criada'); refresh(); };
    $('#body').onclick = async e => {
      const b = e.target.closest('button[data-up],button[data-dn],button[data-hd],button[data-rn],button[data-rm]'); if(!b) return;
      const [k,v] = Object.entries(b.dataset)[0], i=+v, c=cats[i];
      let error;
      if (k==='up'||k==='dn') { const arr=[...cats]; const j=k==='up'?i-1:i+1; [arr[i],arr[j]]=[arr[j],arr[i]];
        const res = await Promise.all(arr.map((x,n)=>sb.from('categories').update({position:n}).eq('id',x.id))); error = res.find(r=>r.error)?.error; }
      if (k==='hd') ({error} = await sb.from('categories').update({active:!c.active}).eq('id',c.id));
      if (k==='rn') { const n = prompt('Novo nome da categoria', c.name); if(!n||!n.trim()) return; ({error} = await sb.from('categories').update({name:n.trim()}).eq('id',c.id)); }
      if (k==='rm') { if(!confirm('Apagar a categoria "'+c.name+'"?')) return; ({error} = await sb.from('categories').delete().eq('id',c.id)); }
      if (error) return toast(errMsg(error)); refresh();
    };
  }

  // ---------- Loja ----------
  function Settings(){
    let logo = st.logo_url, cover = st.cover_url, lf=null, cf=null;
    $('#body').innerHTML = `<form id="sf">
      <div class="card"><h2>Dados da loja</h2>
        <label class="f">Nome<input class="in" name="name" required maxlength="60" value="${esc(st.name)}"></label>
        <label class="f">WhatsApp que recebe os pedidos <span class="h">DDD + número</span><input class="in" name="wa" inputmode="tel" value="${esc(st.whatsapp||'')}"></label>
        <label class="f">Cor da loja<input class="in" name="color" type="color" value="${esc(st.accent_color)}" style="max-width:120px;padding:4px"></label>
        <div class="f">Logo</div><div class="pick"><div class="pv" id="lv" style="${logo?`background-image:url('${esc(logo)}')`:''}">${logo?'':'Sem logo'}</div><label class="btn soft sm" style="cursor:pointer">Trocar logo<input type="file" accept="image/*" id="lfi" class="hide"></label></div>
        <div class="f">Foto de capa</div><div class="pick wide"><div class="pv" id="cv" style="${cover?`background-image:url('${esc(cover)}')`:''}">${cover?'':'Sem capa'}</div><label class="btn soft sm" style="cursor:pointer">Trocar capa<input type="file" accept="image/*" id="cfi" class="hide"></label></div>
      </div>
      <div class="card"><h2>Pedidos</h2>
        <label class="chk"><input type="checkbox" name="del" ${st.accepts_delivery?'checked':''}> Faz entrega</label>
        <label class="chk"><input type="checkbox" name="pick" ${st.accepts_pickup?'checked':''}> Cliente pode retirar no local</label>
        <label class="chk"><input type="checkbox" name="dine" ${st.accepts_dine_in?'checked':''}> Consumo no local (mesa)</label>
        <div class="row" style="margin-top:10px">
          <label class="f">Taxa de entrega (R$) <span class="h">0,00 = entrega grátis</span><input class="in" name="fee" inputmode="decimal" value="${centsIn(st.delivery_fee_cents||0)}"></label>
          <label class="f">Pedido mínimo (R$)<input class="in" name="min" inputmode="decimal" value="${centsIn(st.min_order_cents||0)}"></label>
          <label class="f">Entrega: de (min)<input class="in" name="dmin" type="number" min="0" value="${st.delivery_minutes_min??''}"></label>
          <label class="f">até (min)<input class="in" name="dmax" type="number" min="0" value="${st.delivery_minutes_max??''}"></label></div>
        <label class="chk"><input type="checkbox" name="paused" ${st.is_paused?'checked':''}> Pausar loja (aparece "Fechado")</label>
      </div>
      <p class="small" id="smsg" style="color:#b42318"></p>
      <button class="btn" id="ss">Salvar alterações</button></form>`;
    const prevImg = (inp, box, set) => $(inp).onchange = e => { const fl=e.target.files[0]; if(!fl) return; set(fl); $(box).style.backgroundImage=`url('${URL.createObjectURL(fl)}')`; $(box).textContent=''; };
    prevImg('#lfi','#lv',x=>lf=x); prevImg('#cfi','#cv',x=>cf=x);
    $('#sf').onsubmit = async e => {
      e.preventDefault(); const f=e.target, wa=digits(f.wa.value), min=toCents(f.min.value||'0');
      if (wa && (wa.length<10||wa.length>13)) return $('#smsg').textContent='WhatsApp inválido. Use DDD + número.';
      if (!f.del.checked && !f.pick.checked && !f.dine.checked) return $('#smsg').textContent='Escolha pelo menos uma forma de receber o pedido.';
      const fee = toCents(f.fee.value || '0');
      if (isNaN(fee) || fee < 0) return $('#smsg').textContent='Taxa de entrega inválida. Ex.: 5,00';
      $('#ss').disabled=true; $('#ss').textContent='Salvando…';
      try {
        if (lf) logo = await uploadImage(storeId, lf);
        if (cf) cover = await uploadImage(storeId, cf);
        const n = v => v===''?null:Math.max(0,parseInt(v,10));
        const { error } = await sb.from('stores').update({ name:f.name.value.trim(), whatsapp:wa||null, accent_color:f.color.value, logo_url:logo, cover_url:cover,
          accepts_delivery:f.del.checked, accepts_pickup:f.pick.checked, accepts_dine_in:f.dine.checked, min_order_cents:isNaN(min)?0:min, delivery_fee_cents:fee,
          delivery_minutes_min:n(f.dmin.value), delivery_minutes_max:n(f.dmax.value), is_paused:f.paused.checked }).eq('id',storeId);
        if (error) throw error;
        toast('Loja atualizada'); refresh();
      } catch(err) { $('#smsg').textContent=errMsg(err); $('#ss').disabled=false; $('#ss').textContent='Salvar alterações'; }
    };
  }
  frame();
}
}
</script>
</body>
</html>
